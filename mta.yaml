_schema-version: 3.3.0
ID: employee-leave-mgmt-system
description: A simple CAP project.
version: 1.0.0

modules:
  - name: employee-leave-mgmt-system-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: employee-leave-mgmt-system-db
      - name: employee-leave-mgmt-system-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: employee-leave-mgmt-system-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: employee-leave-mgmt-system-db
    parameters:
      buildpack: nodejs_buildpack

  - name: employee-leave-mgmt-system-destination-content
    type: com.sap.application.content
    requires:
      - name: employee-leave-mgmt-system-destination-service
        parameters:
          content-target: true
      - name: employee-leave-mgmt-system-html5-app-host-service
        parameters:
          service-key:
            name: employee-leave-mgmt-system_html_repo_host-key
      - name: employee-leave-mgmt-system-auth
        parameters:
          service-key:
            name: employee-leave-mgmt-system-auth-key
    parameters:
      content:
        instance:
          destinations:
            - Name: emp_router_employee_leave_mgmt_system_html_repo_host
              ServiceInstanceName: employee-leave-mgmt-system-html5-app-host-service
              ServiceKeyName: employee-leave-mgmt-system_html_repo_host-key
              sap.cloud.service: emp-router
            - Authentication: OAuth2UserTokenExchange
              Name: emp_router_employee_leave_mgmt_system_auth
              ServiceInstanceName: employee-leave-mgmt-system-auth
              ServiceKeyName: employee-leave-mgmt-system-auth-key
              sap.cloud.service: emp-router
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true

  - name: employee-leave-mgmt-system-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: employee-leave-mgmt-system-html5-app-host-service
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - empleaverequest.zip
          name: empleaverequest
          target-path: resources/
        - artifacts:
            - admin.zip
          name: admin
          target-path: resources/

  - name: empleaverequest
    type: html5
    path: app/emp-leave-request
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: admin
    type: html5
    path: app/admin
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  - name: employee-leave-mgmt-system-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: employee-leave-mgmt-system-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: employee-leave-mgmt-system-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

  - name: employee-leave-mgmt-system-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
      service: destination
      service-name: employee-leave-mgmt-system-destination-service
      service-plan: lite

  - name: employee-leave-mgmt-system-html5-app-host-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: employee-leave-mgmt-system-html5-app-host-service
      service-plan: app-host

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production